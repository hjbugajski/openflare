[opcache]
opcache.enable=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.save_comments=1
opcache.fast_shutdown=1
opcache.jit_buffer_size=100M

[PHP]
memory_limit=256M
max_execution_time=300
max_input_time=300

upload_max_filesize=10M
post_max_size=12M

display_errors=Off
display_startup_errors=Off
log_errors=On
error_log=/dev/stderr

session.save_handler=files
session.save_path=/var/www/html/storage/framework/sessions

; UTC only; Laravel handles display conversion
date.timezone=UTC

expose_php=Off
; Disable dangerous shell-execution functions.
; proc_open/popen are required by Laravel's scheduler and queue worker
; (Symfony\Component\Process). parse_ini_file is used by vendor libs.
disable_functions=exec,passthru,shell_exec,system,show_source

realpath_cache_size=4096K
realpath_cache_ttl=600
